name: Build, Test, and Publish Bazel (Rust)

on:
  push:
    branches:
      - master
      - "release-*"
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - master
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g., 9.3.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-rust:
    name: Cargo & Bazelisk Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --locked

      - name: Verify Bazelisk & wrapper packaging compatibility (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/packages/bazel_rs_bazelisk_test.sh

  package-bazelisk-binaries:
    name: Package bazel-${{ matrix.bazel_os }}-${{ matrix.bazel_arch }}
    needs: test-rust
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bazel_os: linux
            bazel_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            bazel_os: linux
            bazel_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - runner: macos-13
            bazel_os: darwin
            bazel_arch: x86_64
            rust_target: x86_64-apple-darwin
          - runner: macos-14
            bazel_os: darwin
            bazel_arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: windows-latest
            bazel_os: windows
            bazel_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(grep '^version = ' Cargo.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and package Bazelisk-compatible binaries
        shell: bash
        run: |
          ./scripts/packages/package_bazel_rs.sh \
            --version "${{ steps.version.outputs.version }}" \
            --os "${{ matrix.bazel_os }}" \
            --arch "${{ matrix.bazel_arch }}" \
            --target "${{ matrix.rust_target }}" \
            --output-dir dist/release

      - name: Upload Bazelisk release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bazel-rs-${{ matrix.bazel_os }}-${{ matrix.bazel_arch }}
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Publish Bazelisk Release to GitHub Releases
    needs: package-bazelisk-binaries
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display packaged Bazelisk artifacts
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --title "Bazel ${TAG} (Rust)" \
              --generate-notes
          fi

