---
check_docs: 0
tasks:
  rockylinux8:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//:bazel-distfile.zip"
      - "//scripts/packages/debian:bazel-debian.deb"
      - "//scripts/packages:with-jdk/install.sh"
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//src/test/shell/bazel:help_test"
    include_json_profile:
      - build
      - test
  rockylinux8_arm64:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//:bazel-distfile.zip"
      - "//scripts/packages/debian:bazel-debian.deb"
      - "//scripts/packages:with-jdk/install.sh"
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//src/test/shell/bazel:help_test"
    include_json_profile:
      - build
      - test
  fedora43:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
    include_json_profile:
      - build
  ubuntu2404:
    shards: 6
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//..."
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//..."
      # Keep only the latest (jdk25) toolchain_head tests in presubmit; older JDKs stay covered in postsubmit.yml.
      - "-//src/test/shell/bazel:bazel_java_test_jdk11_toolchain_head"
      - "-//src/test/shell/bazel:bazel_java_test_jdk17_toolchain_head"
      - "-//src/test/shell/bazel:bazel_java_test_jdk21_toolchain_head"
      - "-//src/test/shell/bazel:bazel_coverage_java_jdk11_toolchain_head_test"
      - "-//src/test/shell/bazel:bazel_coverage_java_jdk17_toolchain_head_test"
      - "-//src/test/shell/bazel:bazel_coverage_java_jdk21_toolchain_head_test"
      # Redundant worker variants (bazel_worker_test and bazel_hardened_sandboxed_worker_test stay in presubmit).
      - "-//src/test/shell/integration:bazel_sandboxed_worker_test"
      - "-//src/test/shell/integration:bazel_sandboxed_worker_with_cgroups_test"
      - "-//src/test/shell/integration:bazel_worker_with_cgroups_test"
      - "-//src/test/shell/integration:bazel_json_worker_test"
      - "-//src/test/shell/integration:bazel_worker_multiplexer_test"
      # Already runs on macOS arm64 presubmit.
      - "-//src/test/java/com/google/devtools/build/lib/rules/objc:ObjcRulesTests"
    include_json_profile:
      - build
      - test
  ubuntu2404_clang:
    platform: ubuntu2404
    environment:
      CC: clang
      CC_CONFIGURE_DEBUG: 1
    name: "Clang"
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      # Tagged as manual, cross-compiles Bazel for Windows.
      - "//src:bazel_windows_llvm"
    test_flags:
      - "--config=ci-linux"
    test_targets:
      - "//src/test/shell/bazel:help_test"
    include_json_profile:
      - build
      - test
  ubuntu2204:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
    build_flags:
      - "--config=ci-linux"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
    test_flags:
      - "--config=ci-linux"
      - "--test_tag_filters=-no_presubmit"
    test_targets:
      - "//src/test/shell/bazel:help_test"
    include_json_profile:
      - build
      - test
  # macos:
  #   environment:
  #     ANDROID_HOME: ""
  #     ANDROID_NDK_HOME: ""
  #   shell_commands:
  #     - rm -rf $HOME/bazeltest
  #     - mkdir $HOME/bazeltest
  #     - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
  #   build_flags:
  #     - "--config=ci-macos"
  #   build_targets:
  #     - "//src:bazel"
  #     - "//src:bazel_jdk_minimal"
  #     - "//src:java_tools_zip"
  #     - "//src:java_tools_prebuilt_zip"
  #   include_json_profile:
  #     - build
  macos_arm64:
    shards: 3
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
      - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
    build_flags:
      - "--config=ci-macos"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//src:java_tools_zip"
      - "//src:java_tools_prebuilt_zip"
    test_flags:
      - "--config=ci-macos"
      - "--test_tag_filters=-no_presubmit,-no_macos"
      # Fine tune the number of test jobs running in parallel to avoid timeout
      - "--local_test_jobs=2"
      # Increase the test timeout by 20% to avoid flaky test failures due to timeout
      - "--test_timeout=72,360,1080,4320"
    test_targets:
      - "//:verify_module_bazel_lock"
      - "//src:embedded_tools_size_test"
      - "//src/test/java/com/google/devtools/build/lib/rules/apple:AppleRulesTests"
      - "//src/test/java/com/google/devtools/build/lib/rules/objc:ObjcRulesTests"
      - "//src/test/java/com/google/devtools/build/lib/skyframe:MacOSXFsEventsDiffAwarenessTest"
      - "//src/test/py/bazel:bazel_module_test"
      - "//src/test/py/bazel:mod_command_test"
      - "//src/test/shell/bazel:bazel_example_test"
      - "//src/test/shell/bazel:bazel_java_test"
      - "//src/test/shell/bazel:bazel_test_test"
      - "//src/test/shell/bazel:cc_integration_test"
      - "//src/test/shell/bazel:cpp_darwin_integration_test"
      - "//src/test/shell/bazel:external_integration_test"
      - "//src/test/shell/bazel:help_test"
      - "//src/test/shell/bazel/apple:bazel_apple_test"
      - "//src/test/shell/bazel/apple:bazel_objc_test"
      - "//src/test/shell/integration:aquery_test"
      - "//src/test/shell/integration:bazel_query_test"
    include_json_profile:
      - build
      - test
  windows:
    shards: 8
    setup:
      - mkdir C:\b
      - mklink /J C:\b\bazeltest_external %OUTPUT_BASE:/=\%\external
    build_flags:
      - "--config=ci-windows"
    build_targets:
      - "//src:bazel.exe"
      - "//src:bazel_jdk_minimal"
      - "//src:test_repos"
      - "//src/main/java/..."
      - "//src:java_tools_zip"
      - "//src:java_tools_prebuilt_zip"
    test_flags:
      - "--config=ci-windows"
      # We need to keep --test_tag_filters here for the bazel-diff integration.
      - "--test_tag_filters=-no_presubmit,-no_windows,-slow"
    test_targets:
      - "//src:embedded_tools_size_test"
      - "//src/test/cpp/..."
      - "//src/test/java/com/google/devtools/build/lib/..."
      - "//src/test/java/com/google/devtools/build/skyframe/..."
      - "//src/test/java/com/google/devtools/common/options/..."
      - "//src/test/native/windows/..."
      - "//src/test/py/bazel/..."
      - "//src/test/shell/..."
      - "//src/tools/launcher/..."
      - "//src/tools/one_version/..."
      - "//src/tools/singlejar/..."
      - "//third_party/def_parser/..."
      - "//scripts/aquery_differ/..."
      - "//tools/bash/..."
      - "//tools/build_defs/..."
      - "//tools/java/..."
      - "//tools/jdk/..."
      - "//tools/python/..."
      - "//tools/test/..."
      # Re-enable the following tests on Windows:
      # https://github.com/bazelbuild/bazel/issues/4292
      - "-//src/test/shell/bazel/remote/..."
      # Too slow for Windows presubmit (24 shards, ~19m wall time on a single VM).
      - "-//src/test/java/com/google/devtools/build/lib/skyframe/rewinding:RewindingTest"
      # Heavy toolchain_head tests that rarely fail uniquely on Windows; jdk25 stays on Ubuntu 24.04 presubmit and all versions stay in postsubmit.yml.
      - "-//src/test/shell/bazel:bazel_java_test_jdk11_toolchain_head"
      - "-//src/test/shell/bazel:bazel_java_test_jdk17_toolchain_head"
      - "-//src/test/shell/bazel:bazel_java_test_jdk21_toolchain_head"
      - "-//src/test/shell/bazel:bazel_java_test_jdk25_toolchain_head"
      # Heavy platform-agnostic tests that rarely fail uniquely on Windows; still covered on Ubuntu 24.04 presubmit and Windows postsubmit.
      - "-//src/test/java/com/google/devtools/build/lib/buildtool:OutputArtifactConflictTest"
      - "-//src/test/java/com/google/devtools/build/lib/buildtool:GenQueryIntegrationTest"
      - "-//src/test/java/com/google/devtools/build/lib/buildtool:SkymeldBuildIntegrationTest"
      - "-//src/test/java/com/google/devtools/build/lib/buildtool:ConvenienceSymlinkTest"
      - "-//src/test/java/com/google/devtools/build/lib/starlark:StarlarkRuleClassFunctionsTest"
      - "-//src/test/java/com/google/devtools/build/lib/starlark:StarlarkRuleContextTest"
      - "-//src/test/java/com/google/devtools/build/lib/starlark:StarlarkRuleImplementationFunctionsTest"
      - "-//src/test/java/com/google/devtools/build/lib/starlark:StarlarkIntegrationTest"
      - "-//src/test/java/com/google/devtools/build/lib/packages:PackagesTests"
      - "-//src/test/java/com/google/devtools/build/lib/query2/engine:AllTests"
      - "-//src/test/shell/bazel:starlark_repository_test"
      - "-//src/test/shell/bazel:starlark_git_repository_test"
      - "-//src/test/shell/bazel:bazel_java_tools_test"
      - "-//src/test/py/bazel:mod_command_test"
      - "-//src/test/py/bazel:bazel_vendor_test"
      - "-//src/test/py/bazel:bazel_overrides_test"
      - "-//src/test/shell/integration:target_compatible_with_test"
      - "-//src/test/shell/integration:configured_query_test"
      - "-//src/test/shell/integration:loading_phase_tests"
    include_json_profile:
      - build
      - test
  rbe_ubuntu2404:
    platform: ubuntu2404
    name: "RBE"
    build_flags:
      - "--config=remote"
      - "--config=ci-common"
      - "--experimental_output_paths=strip"
    build_targets:
      - "//src:bazel"
      - "//src:bazel_jdk_minimal"
    test_flags:
      - "--config=remote"
      - "--config=ci-common"
      - "--test_tag_filters=-no_presubmit"
      - "--experimental_output_paths=strip"
    test_targets:
      - "//src:embedded_tools_size_test"
      - "//src/test/shell/bazel:bazel_java_test"
      - "//src/test/shell/bazel:cc_integration_test"
      - "//src/test/shell/bazel:help_test"
    include_json_profile:
      - build
      - test
