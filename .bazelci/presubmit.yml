---
# DEBUG ONLY: trimmed down to a single Windows task that runs
# testMemoryPressureRestartDuringCachedFetch repeatedly. Do not merge.
tasks:
  windows:
    setup:
      - mkdir C:\b
      - mklink /J C:\b\bazeltest_external %OUTPUT_BASE:/=\%\external
    build_flags:
      - "--config=ci-windows"
    build_targets:
      - "//src:bazel.exe"
    test_flags:
      - "--config=ci-windows"
      # We need to keep --test_tag_filters here for the bazel-diff integration.
      - "--test_tag_filters=-no_presubmit,-no_windows,-slow"
      - "--test_filter=RemoteRepoContentsCacheTest.testMemoryPressureRestartDuringCachedFetch"
      - "--test_sharding_strategy=disabled"
      - "--runs_per_test=6"
      - "--local_test_jobs=2"
      - "--nocache_test_results"
      - "--flaky_test_attempts=1"
      - "--test_output=all"
      - "--test_timeout=3600"
    test_targets:
      - "//src/test/py/bazel:remote_repo_contents_cache_test"
