---
tasks:
  macos:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
      - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
      - if [ -n "${UPDATE_BAZEL_LOCK_FILE:-}" ]; then bazel mod deps --lockfile_mode=update; fi
    environment:
      ANDROID_HOME: ""
      ANDROID_NDK_HOME: ""
    build_flags:
      - "--config=ci-macos"
    build_targets:
      - "//src:bazel"
    include_json_profile:
      - build
  macos_arm64:
    shell_commands:
      - rm -rf $HOME/bazeltest
      - mkdir $HOME/bazeltest
      - ln -sf $OUTPUT_BASE/external $HOME/bazeltest/external
      - if [ -n "${UPDATE_BAZEL_LOCK_FILE:-}" ]; then bazel mod deps --lockfile_mode=update; fi
    build_flags:
      - "--config=ci-macos"
    build_targets:
      - "//src:bazel"
    include_json_profile:
      - build
